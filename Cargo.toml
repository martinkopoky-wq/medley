[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/medley"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/martinkopoky-wq/medley"
authors = ["Martin Pokorny"]

[workspace.dependencies]
medley-core = { path = "crates/medley-core" }
medley-providers = { path = "crates/medley-providers" }
medley-audio = { path = "crates/medley-audio", default-features = false }
medley-ai = { path = "crates/medley-ai" }

anyhow = "1"
thiserror = "2"
async-trait = "0.1"
base64 = "0.22"
directories = "6"
futures = "0.3"
open = "5"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "charset"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
