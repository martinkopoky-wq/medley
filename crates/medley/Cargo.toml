[package]
name = "medley"
description = "One fast native library for Spotify, SoundCloud and Apple Music"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["spotify-playback"]
spotify-playback = ["medley-audio/spotify"]

[dependencies]
medley-core.workspace = true
medley-providers.workspace = true
medley-audio = { workspace = true, default-features = false }
medley-ai.workspace = true
anyhow.workspace = true
rand.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures.workspace = true
open.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["image", "http"] }
egui_dock = { version = "0.21", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
