name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev \
            desktop-file-utils xvfb xauth

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p medley --target ${{ matrix.target }}

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/appimage.sh "target/${{ matrix.target }}/release/medley" "$GITHUB_REF_NAME"

      - name: Smoke test AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          sha256sum --check ./*.AppImage.sha256
          image=$(realpath ./*.AppImage)
          mkdir smoke
          cd smoke
          "$image" --appimage-extract > /dev/null
          desktop-file-validate squashfs-root/app.medley.Medley.desktop
          env MEDLEY_DEMO=1 MEDLEY_SCREENSHOT="$PWD/smoke.png" LIBGL_ALWAYS_SOFTWARE=1 \
            timeout 60s xvfb-run -a ./squashfs-root/AppRun
          test -s smoke.png

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name="medley-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/medley" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp packaging/linux/app.medley.Medley.desktop "dist/$name/"
            cp assets/icon-256.png "dist/$name/app.medley.Medley.png"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "medley-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/medley.exe" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: medley-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: medley-AppImage-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
